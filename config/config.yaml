# Path to this config can be set via env variable 'CONFIG_FILE'
# App registration must have access to the Azure resources + Admin Consent for AzureAD
# Client Secret can also be set via env variable 'CLIENT_SECRET'
# Redis Access Token can also be set via env variable 'REDIS_TOKEN'

url: http://localhost:8080

# User whitelistings will expire/be removed after 24 hours
ttl: 24 # hours

# How the app learns a user's address, per family. This controls what we
# COLLECT; a resource's ip_version controls where we SEND it.
#
# Both families default to enabled. Omitting this block entirely reproduces the
# previous behaviour: whichever family the browser connected over is recorded.
#
# header — a trusted client-IP header set by your proxy. The value is something
#   the app observed, so it cannot be forged by the user.
# url — a family-pinned echo service fetched BY THE BROWSER, letting a
#   dual-stack user register both addresses in one visit. The address arrives as
#   a claim the app cannot verify, so an authenticated user could whitelist an
#   address they do not control. Setting url is the opt-in to that trade-off.
# url_timeout — how long the browser may spend on that fetch (default 5s).
#
# ip_resolution:
#   ipv4:
#     enabled: true
#     header: Cf-Connecting-Ip
#     url: https://ipv4.icanhazip.com
#     url_timeout: 5s
#   ipv6:
#     enabled: true
#     header: Cf-Connecting-Ip
#     url: https://ipv6.icanhazip.com
#     url_timeout: 5s

auth:
  type: azure
  tenant_id: notreal-not-real-not-notreal
  client_id: notreal-not-real-not-notreal
  client_secret: notrealnotrealnotreal

redis:
  host: redis
  port: 6379
  token: my-sup3r-comp1ic4t3d-s3cr3t-t0k3n

# UniFi gateway for the 'unifi' provider (single gateway).
# Username/Password can also be set via env vars UNIFI_USERNAME / UNIFI_PASSWORD.
# Host contains 'notreal' so the sample config never touches a real gateway.
unifi:
  host: https://notreal.gateway
  site: default
  username: ip-whitelister
  password: notrealnotrealnotreal

resources:
  - cloud: azure
    type: frontdoor
    subscription_id: notreal-not-real-not-notreal
    resource_group: notreal-rg
    policy_name: notrealpolicy
  - cloud: azure
    type: storageaccount
    subscription_id: notreal-not-real-not-notreal
    resource_group: notreal-rg
    name: notrealstorage
    group:
      - b111111a-b11a-111a-bb11-1a111aaa11a11 # group object id
  - cloud: azure
    type: keyvault
    subscription_id: notreal-not-real-not-notreal
    resource_group: notreal-rg
    name: notrealkeyvault
  - cloud: azure
    type: postgres
    subscription_id: notreal-not-real-not-notreal
    resource_group: notreal-rg
    name: notpostgresserver
    ip_whitelist:
      - 51.0.0.0/24 # my company proxy addresses 3
    group:
      - a111111a-a11a-111a-aa11-1a111aaa11a11 # group object id
  - cloud: azure
    type: redis
    subscription_id: notreal-not-real-not-notreal
    resource_group: notreal-rg
    name: notrealredis
  - cloud: azure
    type: cosmosdb
    subscription_id: notreal-not-real-not-notreal
    resource_group: notreal-rg
    name: notrealcosmosdb
    ip_whitelist: # https://docs.microsoft.com/en-us/azure/cosmos-db/how-to-configure-firewall#allow-requests-from-the-azure-portal
      - 104.42.195.92
      - 40.76.54.131
      - 52.176.6.30
      - 52.169.50.45
      - 52.187.184.26
  - cloud: unifi
    type: networklist
    name: ip-whitelister # the UniFi Network List to keep in sync
  # ip_version selects which address family a resource is whitelisted for:
  #   ipv4 (default) | ipv6 | both
  # A user has one address per family. Without ip_resolution urls configured
  # they only have whichever family their browser reached the app over, so an
  # IPv4-only user never appears in an ipv6 resource.
  # Note: azure frontdoor defaults to both, since it has never filtered by family.
  # A UniFi Network List is family-typed, so IPv6 needs its own list.
  - cloud: unifi
    type: networklist
    name: ip-whitelister-ipv6
    ip_version: ipv6

# This whitelist will be applied to all resources and should be static non-human IPs only
ip_whitelist:
  - 85.0.0.0/24 # my company proxy addresses 1
  - 200.0.0.0/24 # my company proxy addresses 2
